services:
  mysql:
    image: mysql:8.4
    container_name: happy4j-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: happy4j
      MYSQL_USER: happy4j
      MYSQL_PASSWORD: happy4j
      MYSQL_ROOT_PASSWORD: happy4j-root
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    volumes: ["happy4j_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhappy4j", "-phappy4j"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  happy4j_mysql:
